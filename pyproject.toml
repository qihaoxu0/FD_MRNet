[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fdmrnet-rr"
version = "0.1.0"
description = "FD-MRNet implementation for 3D through-plane MRI super-resolution"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6,<2.8",
  "numpy>=1.26,<3",
  "nibabel>=5.2",
  "PyYAML>=6.0",
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-image>=0.23",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "tqdm>=4.66",
  "tabulate>=0.9",
  "fvcore>=0.1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fdmrnet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
